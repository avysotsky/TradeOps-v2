name: Deribit raw market stream

on:
  push:
    branches:
      - TradeOps/to-v2-41-deribit-raw-websocket-depth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile raw market stream API
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj --configuration Release
      - name: Test raw book snapshot/change/gap and auth without exchange
        run: dotnet test tests/TradeOps.UnitTests/TradeOps.UnitTests.csproj --configuration Release --filter 'FullyQualifiedName~DeribitRawBookTests|FullyQualifiedName~DeribitMarketControllerTests|FullyQualifiedName~DeribitReactTerminalSecurityTests'
      - name: Build event-driven React terminal
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm run build
