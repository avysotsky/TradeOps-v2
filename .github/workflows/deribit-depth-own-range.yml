name: Deribit depth range and own orders

on:
  push:
    branches:
      - TradeOps/to-v2-47-dom-depth-own-order-range
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile independent .NET market API
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj --configuration Release
      - name: Offline 75-level RAW L2, own-order and auth regression tests
        run: dotnet test tests/TradeOps.UnitTests/TradeOps.UnitTests.csproj --configuration Release --filter 'FullyQualifiedName~DeribitRawBookTests|FullyQualifiedName~DeribitOwnOrderBookTests|FullyQualifiedName~DeribitMarketControllerTests|FullyQualifiedName~DeribitReactTerminalSecurityTests'
      - name: Test selectable depth, offscreen own orders and build React
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
