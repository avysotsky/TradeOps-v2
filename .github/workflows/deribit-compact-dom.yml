name: Deribit compact DOM

on:
  push:
    branches:
      - TradeOps/to-v2-43-compact-dom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test compact Price-Amount-Cumulative DOM and build React
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build isolated mainnet read-only terminal API
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj -c Release
