name: Deribit live own orders DOM overlay

on:
  push:
    branches:
      - TradeOps/to-v2-46-live-own-orders-dom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-read-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile isolated read-only API
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj --configuration Release
      - name: Offline private order reconciliation, market book and permission regression
        run: dotnet test tests/TradeOps.UnitTests/TradeOps.UnitTests.csproj --configuration Release --filter 'FullyQualifiedName~DeribitOwnOrderBookTests|FullyQualifiedName~DeribitRawBookTests|FullyQualifiedName~DeribitMarketControllerTests|FullyQualifiedName~DeribitReactTerminalSecurityTests'
      - name: Test unchanged DOM and build React
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
