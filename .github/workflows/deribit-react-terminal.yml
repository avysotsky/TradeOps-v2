name: Deribit React terminal

on:
  push:
    branches:
      - TradeOps/to-v2-38-deribit-react-terminal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile standalone terminal API (no PostgreSQL)
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj --configuration Release

      - name: Compile React terminal
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check local auth and fail-closed order route (no Deribit calls)
        env:
          DeribitTerminal__Environment: testnet
          DeribitTerminal__ExecutionEnabled: 'false'
          DeribitTerminal__MainnetExecutionEnabled: 'false'
          DeribitTerminal__OperatorKey: 'ci-terminal-operator-key-no-real-account-123456'
        run: |
          set -euo pipefail
          dotnet run --project apps/TradeOps.TerminalApi --configuration Release --no-build > /tmp/tradeops-terminal-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            code="$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:5058/api/deribit-terminal/status || true)"
            if [ "$code" = 401 ]; then break; fi
            if [ "$attempt" = 40 ]; then cat /tmp/tradeops-terminal-api.log; exit 1; fi
            sleep 1
          done

          status="$(curl --fail --silent -H 'X-TradeOps-Terminal-Key: ci-terminal-operator-key-no-real-account-123456' \
            http://127.0.0.1:5058/api/deribit-terminal/status)"
          STATUS="$status" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['STATUS'])
          assert data['environment'] == 'testnet'
          assert data['tradingEnabled'] is False
          assert data['credentialsConfigured'] is False
          assert data['instruments'] == ['BTC-PERPETUAL', 'ETH-PERPETUAL']
          PY

          code="$(curl --silent -o /dev/null -w '%{http_code}' \
            -H 'X-TradeOps-Terminal-Key: ci-terminal-operator-key-no-real-account-123456' \
            -H 'Content-Type: application/json' \
            -d '{"instrument":"BTC-PERPETUAL","side":"buy","contracts":10,"price":50000}' \
            http://127.0.0.1:5058/api/deribit-terminal/orders/preview)"
          test "$code" = 409

          # Integration regression for the 2026-10-25 React login 401:
          # Vite must attach the SAME ephemeral session key to proxy GETs.
          # The key is a fake CI-only value, never an exchange credential.
          (
            cd apps/trade-terminal
            TRADEOPS_TERMINAL_OPERATOR_KEY='ci-terminal-operator-key-no-real-account-123456' \
              node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort
          ) > /tmp/tradeops-vite.log 2>&1 &
          vite_pid=$!
          for attempt in $(seq 1 40); do
            code="$(curl --silent -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:5173/api/deribit-terminal/status || true)"
            if [ "$code" = 200 ]; then break; fi
            if [ "$attempt" = 40 ]; then
              cat /tmp/tradeops-vite.log
              echo "React proxy GET expected 200; received $code" >&2
              exit 1
            fi
            sleep 1
          done

          status="$(curl --fail --silent http://127.0.0.1:5173/api/deribit-terminal/status)"
          STATUS="$status" python3 - <<'PY'
          import json, os
          s = json.loads(os.environ['STATUS'])
          assert s['environment'] == 'testnet'
          assert s['tradingEnabled'] is False
          PY

          # Vite must NEVER grant the browser an automatic POST credential.
          code="$(curl --silent -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"instrument":"BTC-PERPETUAL","side":"buy","contracts":10,"price":50000}' \
            http://127.0.0.1:5173/api/deribit-terminal/orders/preview)"
          test "$code" = 401
          kill "$vite_pid" 2>/dev/null || true
