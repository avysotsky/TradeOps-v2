name: build

on:
  push:
    branches:
      - main
      - 'TradeOps/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tradeops_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TradeOps.sln

      - name: Build
        run: dotnet build TradeOps.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test TradeOps.sln --configuration Release --no-build --verbosity normal

      - name: API + PostgreSQL smoke test
        env:
          ConnectionStrings__TradeOpsDb: Host=127.0.0.1;Port=5432;Database=tradeops_ci;Username=postgres;Password=postgres
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Exchange__Provider: Mock
          Telegram__Enabled: 'false'
          Worker__ReconciliationIntervalSeconds: '300'
        run: |
          set -euo pipefail
          WORKER_PID=''

          dotnet run --project src/TradeOps.Api --configuration Release --no-build > api.log 2>&1 &
          API_PID=$!

          cleanup() {
            if [ -n "$WORKER_PID" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
            kill "$API_PID" 2>/dev/null || true
            echo '--- API log ---'; cat api.log || true
            if [ -f worker.log ]; then echo '--- Worker log ---'; cat worker.log || true; fi
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/live >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'API did not become live.' >&2; exit 1; fi
            sleep 2
          done

          READY=$(curl --fail --silent --show-error http://127.0.0.1:5080/health/ready)
          READY_JSON="$READY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['READY_JSON'])
          assert data['status'] == 'ready', data
          assert data['dependencies']['postgres'] == 'ready', data
          assert data['dependencies']['exchangeClient'], data
          PY

          curl --fail --silent --show-error \
            -o openapi.json \
            http://127.0.0.1:5080/swagger/v1/swagger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = json.loads(Path('openapi.json').read_text())['paths']
          required = (
              '/health/live', '/health/ready', '/api/signals', '/api/signals/{id}',
              '/api/integrations/tradingview',
              '/api/integrations/tradingview/operations/deliveries',
              '/api/integrations/tradingview/operations/metrics',
              '/api/integrations/tradingview/operations/health',
              '/api/orders/local/{idOrClientOrderId}',
              '/api/orders/local/{idOrClientOrderId}/history',
              '/api/orders/local/{idOrClientOrderId}/cancel',
              '/api/orders/local/cancel-all',
              '/api/system/reconciliation/status', '/api/system/recovery/status',
              '/api/system/runs',
              '/api/exchange/capabilities',
              '/api/exchange/capabilities/current',
              '/api/metrics/execution', '/api/metrics/execution/window',
              '/api/fills', '/api/pnl/daily')
          for path in required:
              assert path in paths, (path, list(paths))
          PY

          SIGNAL_ID='d0f8625f-2ad4-44eb-a1ec-22acbfbb2e58'
          FIRST=$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci\",\"signalId\":\"$SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals)
          FIRST_JSON="$FIRST" python3 - <<'PY'
          import json, os
          order = json.loads(os.environ['FIRST_JSON'])['order']
          assert order['status'] == 'PartiallyFilled', order
          assert abs(float(order['filledQuantity']) - 0.0006) < 1e-12, order
          PY

          SIGNAL_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$SIGNAL_ID")
          CLIENT_ORDER_ID=$(SIGNAL_AUDIT_JSON="$SIGNAL_AUDIT" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['SIGNAL_AUDIT_JSON'])
          assert data['outcome'] == 'Accepted', data
          assert data['orderId'], data
          print(data['clientOrderId'])
          PY
          )

          HISTORY=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$CLIENT_ORDER_ID/history")
          HISTORY_JSON="$HISTORY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HISTORY_JSON'])
          statuses = [x['status'] for x in data]
          assert statuses[0] == 'Created', data
          assert 'Submitted' in statuses, data
          assert statuses[-1] == 'PartiallyFilled', data
          assert all(x['source'] != 'LegacySnapshot' for x in data), data
          PY

          FILLS=$(curl --fail --silent --show-error 'http://127.0.0.1:5080/api/fills?symbol=BTCUSDT&limit=10')
          FILLS_JSON="$FILLS" python3 - <<'PY'
          import json, os
          assert isinstance(json.loads(os.environ['FILLS_JSON']), list)
          PY

          DAILY_PNL=$(curl --fail --silent --show-error http://127.0.0.1:5080/api/pnl/daily)
          DAILY_PNL_JSON="$DAILY_PNL" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['DAILY_PNL_JSON'])
          assert data['settlementCurrency'] == 'USDT', data
          assert data['isComplete'] is True, data
          PY

          RECON=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5080/api/system/reconcile)
          RECON_JSON="$RECON" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECON_JSON'])
          assert data['updated'] == 1, data
          assert len(data['issues']) == 0, data
          PY

          RECON_STATUS=$(curl --fail --silent --show-error http://127.0.0.1:5080/api/system/reconciliation/status)
          RECON_STATUS_JSON="$RECON_STATUS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECON_STATUS_JSON'])
          assert data['runType'] == 'OrderReconciliation', data
          assert data['isRunning'] is False and data['succeeded'] is True, data
          assert data['ordersScanned'] == 1 and data['ordersUpdated'] == 1, data
          assert data['orderIssues'] == 0 and data['ordersMissingOnExchange'] == 0, data
          assert data['completedAt'], data
          PY

          HISTORY=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$CLIENT_ORDER_ID/history")
          HISTORY_JSON="$HISTORY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HISTORY_JSON'])
          assert data[-1]['status'] == 'Filled', data
          assert abs(float(data[-1]['filledQuantity']) - 0.001) < 1e-12, data
          PY

          RETRY=$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci-retry\",\"signalId\":\"$SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals)
          RETRY_JSON="$RETRY" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['RETRY_JSON'])['order']['status'] == 'Filled'
          PY

          CANCEL_ID='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Sell\",\"quantity\":0.002,\"source\":\"ci-cancel\",\"signalId\":\"$CANCEL_ID\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null
          CANCEL_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$CANCEL_ID")
          CANCEL_CLIENT=$(CANCEL_AUDIT="$CANCEL_AUDIT" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['CANCEL_AUDIT'])['clientOrderId'])
          PY
          )
          CANCEL=$(curl --fail --silent --show-error -X POST "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT/cancel")
          CANCEL_JSON="$CANCEL" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CANCEL_JSON'])
          assert data['outcome'] == 'Cancelled' and data['order']['status'] == 'Cancelled', data
          PY
          CANCEL_RETRY=$(curl --fail --silent --show-error -X POST "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT/cancel")
          CANCEL_RETRY_JSON="$CANCEL_RETRY" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['CANCEL_RETRY_JSON'])['outcome'] == 'AlreadyCancelled'
          PY
          CANCEL_HISTORY=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT/history")
          CANCEL_HISTORY_JSON="$CANCEL_HISTORY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CANCEL_HISTORY_JSON'])
          assert data[-1]['status'] == 'Cancelled', data
          assert 'PartiallyFilled' in [x['status'] for x in data], data
          PY

          BULK_BTC_ID='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
          BULK_ETH_ID='cccccccc-cccc-4ccc-8ccc-cccccccccccc'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.003,\"source\":\"ci-bulk-btc\",\"signalId\":\"$BULK_BTC_ID\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"ETHUSDT\",\"side\":\"Sell\",\"quantity\":0.004,\"source\":\"ci-bulk-eth\",\"signalId\":\"$BULK_ETH_ID\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null
          BULK_RESULT=$(curl --fail --silent --show-error -X POST 'http://127.0.0.1:5080/api/orders/local/cancel-all?symbol=BTCUSDT')
          BULK_RESULT_JSON="$BULK_RESULT" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['BULK_RESULT_JSON'])
          assert data['symbol'] == 'BTCUSDT', data
          assert data['candidateCount'] == 1 and data['cancelledCount'] == 1 and data['isComplete'] is True, data
          PY
          BULK_RETRY=$(curl --fail --silent --show-error -X POST 'http://127.0.0.1:5080/api/orders/local/cancel-all?symbol=BTCUSDT')
          BULK_RETRY_JSON="$BULK_RETRY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['BULK_RETRY_JSON'])
          assert data['candidateCount'] == 0 and data['isComplete'] is True, data
          PY

          STOP=$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"enabled":true,"reason":"CI persistent emergency-stop verification"}' \
            http://127.0.0.1:5080/api/risk/emergency-stop)
          STOP_JSON="$STOP" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['STOP_JSON'])
          assert data['emergencyStop'] is True, data
          assert data['orderCancellation']['candidateCount'] == 1, data
          assert data['orderCancellation']['cancelledCount'] == 1, data
          assert data['orderCancellation']['isComplete'] is True, data
          PY

          BLOCKED='99999999-9999-4999-8999-999999999999'
          CODE=$(curl --silent --show-error -o blocked.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci-risk-block\",\"signalId\":\"$BLOCKED\"}" \
            http://127.0.0.1:5080/api/signals)
          test "$CODE" = '422'

          CLEAR=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"enabled":false}' \
            http://127.0.0.1:5080/api/risk/emergency-stop)
          CLEAR_JSON="$CLEAR" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CLEAR_JSON'])
          assert data['emergencyStop'] is False and data['orderCancellation'] is None, data
          PY

          dotnet run --project src/TradeOps.Worker --configuration Release --no-build > worker.log 2>&1 &
          WORKER_PID=$!

          RECOVERY_STATUS=''
          for attempt in $(seq 1 30); do
            CODE=$(curl --silent --output recovery.json --write-out '%{http_code}' http://127.0.0.1:5080/api/system/recovery/status)
            if [ "$CODE" = '200' ]; then
              RECOVERY_STATUS=$(cat recovery.json)
              if RECOVERY_JSON="$RECOVERY_STATUS" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ['RECOVERY_JSON'])
          sys.exit(0 if data['isRunning'] is False and data['succeeded'] is True else 1)
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 30 ]; then echo 'Worker recovery status did not complete.' >&2; exit 1; fi
            sleep 1
          done

          RECOVERY_JSON="$RECOVERY_STATUS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECOVERY_JSON'])
          assert data['runType'] == 'RecoveryCycle', data
          assert data['isRunning'] is False and data['succeeded'] is True, data
          assert data['completedAt'], data
          assert data['positionsCompared'] >= 1, data
          assert isinstance(data['positionSnapshots'], int) and data['positionSnapshots'] >= 0, data
          assert isinstance(data['positionMismatches'], int), data
          PY

          RUNS=$(curl --fail --silent --show-error 'http://127.0.0.1:5080/api/system/runs?limit=10')
          RUNS_JSON="$RUNS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RUNS_JSON'])
          assert isinstance(data, list) and len(data) >= 3, data
          run_types = {item['runType'] for item in data}
          assert 'OrderReconciliation' in run_types, data
          assert 'RecoveryCycle' in run_types, data
          for item in data:
              assert item['id'], item
              assert item['isRunning'] is False, item
              assert item['succeeded'] is True, item
              assert item['startedAt'] and item['completedAt'], item
          PY

          RECOVERY_RUNS=$(curl --fail --silent --show-error 'http://127.0.0.1:5080/api/system/runs?runType=RecoveryCycle&limit=1')
          RECOVERY_RUNS_JSON="$RECOVERY_RUNS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECOVERY_RUNS_JSON'])
          assert len(data) == 1, data
          assert data[0]['runType'] == 'RecoveryCycle', data
          assert data[0]['succeeded'] is True and data[0]['isRunning'] is False, data
          PY

          METRICS=$(curl --fail --silent --show-error http://127.0.0.1:5080/api/metrics/execution)
          METRICS_JSON="$METRICS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['METRICS_JSON'])
          signals = data['signals']
          orders = data['orders']
          risk = data['risk']
          operations = data['operations']
          assert data['generatedAt'], data
          assert signals['received'] == signals['accepted'] + signals['rejected'] + signals['pending'], signals
          assert signals['accepted'] >= 4 and signals['rejected'] >= 1, signals
          counted_orders = sum(orders[key] for key in (
              'created', 'submitted', 'accepted', 'partiallyFilled',
              'filled', 'cancelled', 'rejected', 'unknown'))
          assert orders['total'] == counted_orders, orders
          assert orders['filled'] >= 1 and orders['cancelled'] >= 3, orders
          assert isinstance(data['fillsReceived'], int) and data['fillsReceived'] >= 0, data
          assert risk['emergencyStop'] is False, risk
          assert isinstance(risk['tradingEnabled'], bool), risk
          assert operations['lastReconciliationSucceeded'] is True, operations
          assert operations['lastRecoverySucceeded'] is True, operations
          assert isinstance(operations['lastRecoveryPositionMismatches'], int), operations
          PY

          WINDOW_FROM=$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          WINDOW_TO=$(date -u -d '10 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          WINDOW_METRICS=$(curl --fail --silent --show-error -G \
            --data-urlencode "from=$WINDOW_FROM" \
            --data-urlencode "to=$WINDOW_TO" \
            http://127.0.0.1:5080/api/metrics/execution/window)
          WINDOW_METRICS_JSON="$WINDOW_METRICS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['WINDOW_METRICS_JSON'])
          signals = data['signals']
          lifecycle = data['orderLifecycle']
          assert data['generatedAt'] and data['fromInclusive'] and data['toExclusive'], data
          assert data['symbol'] is None, data
          assert signals['received'] == (
              signals['acceptedCurrentOutcome'] +
              signals['rejectedCurrentOutcome'] +
              signals['pendingCurrentOutcome']), signals
          assert signals['acceptedCurrentOutcome'] >= 4, signals
          assert signals['rejectedCurrentOutcome'] >= 1, signals
          counted_events = sum(lifecycle[key] for key in (
              'created', 'submitted', 'accepted', 'partiallyFilled',
              'filled', 'cancelled', 'rejected', 'unknown'))
          assert lifecycle['events'] == counted_events, lifecycle
          assert lifecycle['ordersTouched'] >= 4, lifecycle
          assert lifecycle['filled'] >= 1 and lifecycle['cancelled'] >= 3, lifecycle
          assert isinstance(data['fillsReceived'], int) and data['fillsReceived'] >= 0, data
          PY

          BTC_METRICS=$(curl --fail --silent --show-error -G \
            --data-urlencode "from=$WINDOW_FROM" \
            --data-urlencode "to=$WINDOW_TO" \
            --data-urlencode 'symbol= btcusdt ' \
            http://127.0.0.1:5080/api/metrics/execution/window)
          ETH_METRICS=$(curl --fail --silent --show-error -G \
            --data-urlencode "from=$WINDOW_FROM" \
            --data-urlencode "to=$WINDOW_TO" \
            --data-urlencode 'symbol=ETHUSDT' \
            http://127.0.0.1:5080/api/metrics/execution/window)
          WINDOW_METRICS_JSON="$WINDOW_METRICS" BTC_METRICS_JSON="$BTC_METRICS" ETH_METRICS_JSON="$ETH_METRICS" python3 - <<'PY'
          import json, os
          all_data = json.loads(os.environ['WINDOW_METRICS_JSON'])
          btc = json.loads(os.environ['BTC_METRICS_JSON'])
          eth = json.loads(os.environ['ETH_METRICS_JSON'])
          assert btc['symbol'] == 'BTCUSDT', btc
          assert eth['symbol'] == 'ETHUSDT', eth
          assert btc['signals']['received'] >= 4, btc
          assert btc['signals']['acceptedCurrentOutcome'] >= 3, btc
          assert btc['signals']['rejectedCurrentOutcome'] >= 1, btc
          assert eth['signals']['received'] >= 1, eth
          assert eth['signals']['acceptedCurrentOutcome'] >= 1, eth
          assert eth['signals']['rejectedCurrentOutcome'] == 0, eth
          assert btc['orderLifecycle']['ordersTouched'] >= 3, btc
          assert btc['orderLifecycle']['filled'] >= 1, btc
          assert btc['orderLifecycle']['cancelled'] >= 2, btc
          assert eth['orderLifecycle']['ordersTouched'] >= 1, eth
          assert eth['orderLifecycle']['cancelled'] >= 1, eth
          assert all_data['signals']['received'] == btc['signals']['received'] + eth['signals']['received'], (all_data, btc, eth)
          assert all_data['orderLifecycle']['events'] == btc['orderLifecycle']['events'] + eth['orderLifecycle']['events'], (all_data, btc, eth)
          assert isinstance(btc['fillsReceived'], int) and isinstance(eth['fillsReceived'], int), (btc, eth)
          PY

          EMPTY_METRICS=$(curl --fail --silent --show-error -G \
            --data-urlencode "from=$WINDOW_FROM" \
            --data-urlencode "to=$WINDOW_TO" \
            --data-urlencode 'symbol=SOLUSDT' \
            http://127.0.0.1:5080/api/metrics/execution/window)
          EMPTY_METRICS_JSON="$EMPTY_METRICS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['EMPTY_METRICS_JSON'])
          assert data['symbol'] == 'SOLUSDT', data
          assert data['signals']['received'] == 0, data
          assert data['orderLifecycle']['events'] == 0, data
          assert data['orderLifecycle']['ordersTouched'] == 0, data
          assert data['fillsReceived'] == 0, data
          PY

          CODE=$(curl --silent --show-error -o invalid-window.json -w '%{http_code}' -G \
            --data-urlencode "from=$WINDOW_TO" \
            --data-urlencode "to=$WINDOW_FROM" \
            http://127.0.0.1:5080/api/metrics/execution/window)
          test "$CODE" = '400'

      - name: Signed webhook end-to-end demo
        env:
          ConnectionStrings__TradeOpsDb: Host=127.0.0.1;Port=5432;Database=tradeops_signed_demo_ci;Username=postgres;Password=postgres
          ASPNETCORE_URLS: http://127.0.0.1:5081
          Exchange__Provider: Mock
          Telegram__Enabled: 'false'
          SignalIngress__Authentication__Enabled: 'true'
          SignalIngress__Authentication__ApiKey: ci-signed-demo-signal-api-key
          SignalIngress__ReplayProtection__Enabled: 'true'
          SignalIngress__Signing__Enabled: 'true'
          SignalIngress__Signing__Secret: ci-signed-demo-signing-secret-at-least-32-characters
          OperatorApi__Authentication__Enabled: 'true'
          OperatorApi__Authentication__ApiKey: ci-signed-demo-operator-api-key
          TRADEOPS_DEMO_API_URL: http://127.0.0.1:5081
          TRADEOPS_DEMO_SIGNAL_API_KEY: ci-signed-demo-signal-api-key
          TRADEOPS_DEMO_SIGNING_SECRET: ci-signed-demo-signing-secret-at-least-32-characters
          TRADEOPS_DEMO_OPERATOR_API_KEY: ci-signed-demo-operator-api-key
        run: |
          set -euo pipefail

          POSTGRES_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS tradeops_signed_demo_ci WITH (FORCE);'
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE tradeops_signed_demo_ci;'

          dotnet run --project src/TradeOps.Api --configuration Release --no-build > signed-demo-api.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            echo '--- Signed demo API log ---'
            cat signed-demo-api.log || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5081/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'Signed demo API did not become ready.' >&2; exit 1; fi
            sleep 2
          done

          dotnet run --project tools/TradeOps.SignedWebhookDemo --configuration Release --no-build

      - name: Customer TradingView demo
        env:
          ConnectionStrings__TradeOpsDb: Host=127.0.0.1;Port=5432;Database=tradeops_tradingview_customer_demo_ci;Username=postgres;Password=postgres
          ASPNETCORE_URLS: http://127.0.0.1:5082
          Exchange__Provider: Mock
          Telegram__Enabled: 'false'
          Integrations__TradingView__Enabled: 'true'
          Integrations__TradingView__GatewayKey: ci-customer-demo-gateway-key-at-least-32-characters
          Integrations__TradingView__RequireGatewayIpAllowlist: 'false'
          OperatorApi__Authentication__Enabled: 'true'
          OperatorApi__Authentication__ApiKey: ci-customer-demo-operator-key-at-least-32-characters
          TradingViewHealth__Enabled: 'true'
          TradingViewHealth__EvaluationIntervalSeconds: '15'
          TradingViewHealth__LookbackMinutes: '15'
          TradingViewHealth__MinimumDeliveries: '3'
          TradingViewHealth__CriticalFailureCount: '2'
          TradingViewHealth__CriticalFailureRatePercent: '50'
          TradingViewHealth__DegradedConflictRatePercent: '50'
          TradingViewHealth__DegradedRiskRejectedRatePercent: '100'
          TradingViewHealth__MaxAverageLatencyMilliseconds: '5000'
          TradingViewHealth__NoSuccessfulDeliveryMinutes: '0'
          TRADEOPS_TRADINGVIEW_DEMO_API_URL: http://127.0.0.1:5082
          TRADEOPS_TRADINGVIEW_DEMO_GATEWAY_KEY: ci-customer-demo-gateway-key-at-least-32-characters
          TRADEOPS_TRADINGVIEW_DEMO_OPERATOR_API_KEY: ci-customer-demo-operator-key-at-least-32-characters
          TRADEOPS_TRADINGVIEW_DEMO_EVENT_ID: ci-paid-pilot-evidence-event
          TRADEOPS_OPERATOR_API_KEY: ci-customer-demo-operator-key-at-least-32-characters
          TRADEOPS_PILOT_API_URL: http://127.0.0.1:5082
          TRADEOPS_PILOT_EVENT_ID: ci-paid-pilot-evidence-event
          TRADEOPS_PILOT_OUTPUT_DIR: /tmp/tradeops-pilot-evidence
          TRADEOPS_PILOT_CLIENT: CI Customer
          TRADEOPS_PILOT_STAGE: Mock
          TRADEOPS_PILOT_VERSION: v1.3.2.0
        run: |
          set -euo pipefail

          POSTGRES_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS tradeops_tradingview_customer_demo_ci WITH (FORCE);'
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE tradeops_tradingview_customer_demo_ci;'

          dotnet run --project src/TradeOps.Api --configuration Release --no-build > customer-demo-api.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
            kill "$API_PID" 2>/dev/null || true
            echo '--- Customer demo API log ---'
            cat customer-demo-api.log || true
            echo '--- Customer demo Worker log ---'
            cat customer-demo-worker.log || true
          }
          WORKER_PID=''
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5082/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'Customer demo API did not become ready.' >&2; exit 1; fi
            sleep 2
          done

          dotnet run --project src/TradeOps.Worker --configuration Release --no-build > customer-demo-worker.log 2>&1 &
          WORKER_PID=$!

          dotnet run --project tools/TradeOps.TradingViewDemo --configuration Release --no-build

          rm -rf "$TRADEOPS_PILOT_OUTPUT_DIR"
          dotnet run --project tools/TradeOps.PilotEvidence --configuration Release --no-build

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/tradeops-pilot-evidence')
          json_path = root / 'pilot-evidence.json'
          md_path = root / 'pilot-evidence.md'

          assert json_path.exists(), json_path
          assert md_path.exists(), md_path

          data = json.loads(json_path.read_text())
          assert data['technicalDecision'] == 'PASS', data
          assert data['eventId'] == 'ci-paid-pilot-evidence-event', data
          assert data['client'] == 'CI Customer', data
          assert data['stage'] == 'Mock', data
          assert all(item['passed'] for item in data['checks']), data['checks']

          outcomes = {item['outcome'] for item in data['deliveries']}
          assert {'Accepted', 'Redelivered', 'Conflict'} <= outcomes, outcomes

          correlation = data['correlation']
          assert correlation['signalId'], correlation
          assert correlation['clientOrderId'].startswith('trd-'), correlation

          markdown = md_path.read_text()
          assert '# TradeOps Paid Pilot Evidence' in markdown, markdown
          assert '## Client sign-off' in markdown, markdown
          assert 'Technical decision:** PASS' in markdown, markdown
          PY

      - name: Validate client pilot starter kit
        env:
          PILOT_ENV: /tmp/tradeops-client-pilot.env
          PILOT_TLS_DIR: /tmp/tradeops-client-pilot-tls
        run: |
          set -euo pipefail

          mkdir -p "$PILOT_TLS_DIR"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=pilot.local' \
            -keyout "$PILOT_TLS_DIR/privkey.pem" \
            -out "$PILOT_TLS_DIR/fullchain.pem" >/dev/null 2>&1

          cp deploy/client-starter/client-pilot.env.example "$PILOT_ENV"

          sed -i \
            -e 's#TRADEOPS_EXCHANGE_PROVIDER=Mock#TRADEOPS_EXCHANGE_PROVIDER=Mock#' \
            -e 's#CHANGE_ME_RANDOM_GATEWAY_SECRET_32_PLUS#ci-client-pilot-gateway-secret-at-least-32-characters#' \
            -e 's#CHANGE_ME_RANDOM_OPERATOR_SECRET_32_PLUS#ci-client-pilot-operator-secret-at-least-32-characters#' \
            -e "s#/ABSOLUTE/PATH/TO/fullchain.pem#$PILOT_TLS_DIR/fullchain.pem#" \
            -e "s#/ABSOLUTE/PATH/TO/privkey.pem#$PILOT_TLS_DIR/privkey.pem#" \
            "$PILOT_ENV"

          python3 -m json.tool deploy/client-starter/tradingview-alert-sample.json >/dev/null

          bash scripts/client-pilot-preflight.sh "$PILOT_ENV"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate TradingView gateway deployment
        env:
          TRADEOPS_TRADINGVIEW_GATEWAY_KEY: ci-tradingview-gateway-key-at-least-32-characters
          TRADEOPS_TRADINGVIEW_TLS_CERT: /tmp/tradeops-gateway-tls/fullchain.pem
          TRADEOPS_TRADINGVIEW_TLS_KEY: /tmp/tradeops-gateway-tls/privkey.pem
        run: |
          set -euo pipefail

          mkdir -p /tmp/tradeops-gateway-tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=localhost' \
            -keyout /tmp/tradeops-gateway-tls/privkey.pem \
            -out /tmp/tradeops-gateway-tls/fullchain.pem >/dev/null 2>&1

          docker compose \
            -f docker-compose.yml \
            -f deploy/tradingview-gateway/docker-compose.tradingview-gateway.yml \
            config --quiet

          docker run --rm \
            --add-host api:127.0.0.1 \
            -e TRADEOPS_TRADINGVIEW_GATEWAY_KEY="$TRADEOPS_TRADINGVIEW_GATEWAY_KEY" \
            -v "$PWD/deploy/tradingview-gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "/tmp/tradeops-gateway-tls:/etc/nginx/tls:ro" \
            nginx:1.27-alpine nginx -t

      - name: Build Docker images
        run: docker compose build api worker
