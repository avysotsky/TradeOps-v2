name: MIG-01 Private v2 Snapshot Import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mig01-bootstrap.yml'
permissions:
  contents: write
jobs:
  snapshot-import:
    if: github.repository == 'avysotsky/TradeOps-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Import pinned public v1 tree without Git history
        shell: bash
        run: |
          set -euo pipefail
          source_sha=77229d7f4f835b8cf43eb0aeae427d2df509bb11
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://codeload.github.com/avysotsky/TradeOps/tar.gz/${source_sha}" \
            -o "$temp_dir/source.tar.gz"
          mkdir -p "$temp_dir/source"
          tar -xzf "$temp_dir/source.tar.gz" -C "$temp_dir/source" --strip-components=1
          rsync -a \
            --exclude='.git/' \
            --exclude='MIGRATION_BASELINE.md' \
            --exclude='docs/HANDOFF_*' \
            --exclude='docs/orchestration/VS*.md' \
            --exclude='docs/orchestration/WS*.md' \
            --exclude='docs/orchestration/OP0*.md' \
            --exclude='docs/orchestration/SEC0*.md' \
            --exclude='docs/orchestration/HANDOFF_*.md' \
            --exclude='docs/orchestration/ORCHESTRATION.md' \
            --exclude='.github/workflows/arch04-python-embed-probe.yml' \
            --exclude='tools/TradeOps.DocFlowInProcessProbe/' \
            "$temp_dir/source/" ./
          rm -f .github/workflows/mig01-bootstrap.yml
          sed -i 's/Migration stage: \*\*bootstrap\*\*; source import and CI verification pending./Migration stage: **snapshot imported**; private CI verification pending./' MIGRATION_BASELINE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "MIG-01: import TradeOps v1 verified snapshot into private v2 (no Git history)"
          git push origin HEAD:main
          echo "Private TradeOps-v2 snapshot import committed."
