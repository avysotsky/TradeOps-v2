name: Deribit vertical DOM

on:
  push:
    branches:
      - TradeOps/to-v2-42-deribit-vertical-dom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify pure Deribit price ladder ordering
        working-directory: apps/trade-terminal
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Preserve standalone market API compilation
        run: dotnet build apps/TradeOps.TerminalApi/TradeOps.TerminalApi.csproj -c Release
